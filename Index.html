
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Wave | Online Store</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      text-align: center;
    }

    header {
      background: #101820;
      color: white;
      padding: 25px;
    }

    .hero {
      padding: 70px 20px;
    }

    .hero h2 {
      font-size: 36px;
    }

    .shop-button {
      display: inline-block;
      background: #e6a817;
      color: #111;
      padding: 14px 25px;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    footer {
      background: #101820;
      color: white;
      padding: 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1>NEW WAVE</h1>
    <p>Your Online Shopping Destination</p>
  </header>

  <section class="hero">
    <h2>Welcome to New Wave</h2>
    <p>Discover amazing products at great prices.</p>
    <a href="#products" class="shop-button">Shop Now</a>
  </section>

  <section id="products">
    <h2>Our Products</h2>
    <p>Exciting products are coming soon!</p>
  </section>

  <footer>
    <p>© 2026 New Wave. All rights reserved.</p>
  </footer>

</body>
</html>
